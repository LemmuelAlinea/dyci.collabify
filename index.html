<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#26327A" />
    <meta
      name="description"
      content="Collabify is where groups at Dr. Yanga's Colleges run their projects — class coursework, research, events, accreditation and the rest — each one set up the way that group works."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!--
      Only the two faces the first screen needs. Preloading all twelve would
      pull 355 kB before anything renders; the rest arrive when a page first
      asks for them. Outfit 700 is the wordmark and every heading, Instrument
      Sans 400 is the body.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-700.woff2" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-sans-400.woff2"
      crossorigin
    />
    <title>Collabify — projects at Dr. Yanga's Colleges</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      A browser too old for the stylesheet gets told so rather than a page with
      no colours in it. Stays here, after #root and before the module script:
      it writes into #root and has to win that race against React.
    -->
    <script src="/browser-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
